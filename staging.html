<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaundryBazaar — Cloudflare Login Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;font-family:Arial,sans-serif;color:#242424}.wrap{max-width:460px;margin:8vh auto;padding:16px}.panel{background:white;border:2px solid #ffa500;border-radius:12px;padding:25px;box-shadow:0 2px 14px #ddd}h1{font-size:23px;color:#dc8500;margin:0 0 8px}p{line-height:1.5}label{display:block;margin-top:15px;font-weight:bold}input{display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #bbb;border-radius:6px;font-size:16px}button{width:100%;background:#ed9400;color:white;border:0;border-radius:6px;padding:12px;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#555}.small{font-size:13px;color:#666}#status{min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}#signedIn{display:none}.ok{color:#176d34}.error{color:#b21c1c}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<h1>LaundryBazaar</h1>
<p><strong>Cloudflare authentication — staging test only</strong></p>
<p class="small">This page does not access or modify orders, Google Sheets, invoices, or your production website.</p>
<form id="loginForm">
<label for="username">Username</label><input id="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">Test Login</button>
</form>
<div id="signedIn"><p id="account"></p><button id="verifyButton" type="button" class="secondary">Verify Session</button><button id="logoutButton" type="button">Logout</button></div>
<p id="status" role="status" aria-live="polite"></p>
<p class="small">Do not share passwords, tokens, or browser storage screenshots.</p>
</section></main>
<script>
'use strict';
const API='https://laundrybazaar-api.laundrybazaarbhopal.workers.dev';
const STORAGE_KEY='lbCloudflareStagingSession'; // separate from production lbSession
const $=id=>document.getElementById(id);
let token=localStorage.getItem(STORAGE_KEY)||sessionStorage.getItem(STORAGE_KEY)||'';
let busy=false;
function status(message,isError=false){$('status').textContent=message;$('status').className=isError?'error':'ok';}
function setBusy(value){busy=value;['loginButton','verifyButton','logoutButton'].forEach(id=>$(id).disabled=value);}
function showSignedIn(data){$('loginForm').style.display='none';$('signedIn').style.display='block';const user=data?.user||data||{};$('account').textContent='Authenticated'+(user.username?' as '+user.username:'')+(user.role?' ('+user.role+')':'');}
function showSignedOut(){token='';localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem(STORAGE_KEY);$('loginForm').style.display='block';$('signedIn').style.display='none';$('password').value='';}
async function request(path,method='GET',body){const headers={};if(body!==undefined)headers['Content-Type']='application/json';if(token)headers.Authorization='Bearer '+token;const response=await fetch(API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let data;try{data=await response.json();}catch{throw new Error('Unexpected API response (HTTP '+response.status+')');}if(!response.ok||data?.success===false){throw new Error(data?.message||data?.error||'HTTP '+response.status);}return data;}
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;setBusy(true);status('Signing in…');try{const data=await request('/auth/login','POST',{username:$('username').value.trim(),password:$('password').value});const newToken=data.token||data.sessionToken||data.session_token||data?.data?.token;if(!newToken)throw new Error('Login response did not contain a session token.');token=newToken;localStorage.setItem(STORAGE_KEY,token);sessionStorage.removeItem(STORAGE_KEY);$('password').value='';const me=await request('/auth/me');showSignedIn(me);status('Login and session verification successful.');}catch(error){if(token){showSignedOut();}status('Login test failed: '+error.message,true);}finally{setBusy(false);}});
$('verifyButton').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{const data=await request('/auth/me');showSignedIn(data);status('Session verified successfully.');}catch(error){if(/401|unauthoriz|invalid|expired/i.test(error.message))showSignedOut();status('Session verification failed: '+error.message,true);}finally{setBusy(false);}});
$('logoutButton').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await request('/auth/logout','POST');showSignedOut();status('Logged out successfully.');}catch(error){status('Server logout could not be confirmed: '+error.message,true);}finally{setBusy(false);}});
(async()=>{if(!token)return;localStorage.setItem(STORAGE_KEY,token);sessionStorage.removeItem(STORAGE_KEY);setBusy(true);status('Checking saved staging session…');try{const me=await request('/auth/me');showSignedIn(me);status('Saved staging session restored.');}catch(error){if(/401|unauthoriz|invalid|expired/i.test(error.message))showSignedOut();status('Session restore: '+error.message,true);}finally{setBusy(false);}})();
</script>
</body>
</html>
