<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffa500">
<title>Laundry Bazaar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#portal{display:block;width:100%;height:100%;height:100dvh;border:0}
#help{position:fixed;right:8px;bottom:8px;max-width:320px;padding:8px;background:#fff8e8;border:1px solid #ffa500;border-radius:6px;font-size:13px;box-shadow:0 1px 5px #aaa}
summary{cursor:pointer}#help p{margin:8px 0}button{padding:8px;cursor:pointer}
</style>
</head>
<body>
<iframe id="portal" title="Laundry Bazaar Management Portal" allow="microphone *; clipboard-read *; clipboard-write *; fullscreen *" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbyYyI3gcFLFuUZnqtdCq7hBfNen287bbJzXnAvkim9xXFU1gg8J4hHhwEHx6ikuqU65/exec"></iframe>
<details id="help"><summary>Loading problem?</summary><p>If Google displays “refused to connect” or “content blocked”, the Apps Script deployment must allow embedding. This page cannot override Google's access restrictions.</p><button type="button" id="reload">Reload portal</button></details>
<script>
'use strict';
const portal=document.getElementById('portal');
document.getElementById('reload').addEventListener('click',function(){portal.src=portal.getAttribute('src');});
// There is deliberately no top-level redirect. The GitHub address stays visible.
// Native interface contract: startRecognition(mode), stopRecognition(),
// and onAndroidVoiceResult(text, mode)/onAndroidVoiceError(message) callbacks.
let voiceClient=null,activeMode='token',voicePending=false,responseTimer=null;
function trustedPortalOrigin(origin){
 try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(_){return false;}
}
function reply(type,fields){if(voiceClient)voiceClient.source.postMessage(Object.assign({type:type},fields),voiceClient.origin);}
function endPending(){voicePending=false;clearTimeout(responseTimer);responseTimer=null;}
window.onAndroidVoiceResult=function(text,mode){if(!voicePending)return;endPending();reply('LB_NATIVE_VOICE_RESULT',{text:String(text||''),mode:mode||activeMode});};
window.onAndroidVoiceError=function(message){if(!voicePending)return;endPending();reply('LB_NATIVE_VOICE_ERROR',{message:String(message||'Voice recognition failed. Please try again.')});};
window.onAndroidVoiceStatus=function(message){if(voicePending)reply('LB_NATIVE_VOICE_STATUS',{message:String(message||'Listening…')});};
window.addEventListener('message',function(event){
 if(!event.source||event.source===window||!trustedPortalOrigin(event.origin))return;
 const data=event.data;if(!data||typeof data!=='object')return;
 if(data.type==='LB_NATIVE_VOICE_STOP'){
  if(voiceClient&&voiceClient.source!==event.source)return;
  endPending();try{if(window.AndroidVoice&&typeof window.AndroidVoice.stopRecognition==='function')window.AndroidVoice.stopRecognition();}catch(_){}return;
 }
 if(data.type!=='LB_NATIVE_VOICE_REQUEST'||(data.mode!=='token'&&data.mode!=='confirmation')||voicePending)return;
 voiceClient={source:event.source,origin:event.origin};activeMode=data.mode;voicePending=true;
 if(!window.AndroidVoice||typeof window.AndroidVoice.startRecognition!=='function'){
  window.onAndroidVoiceError('Open in the Laundry Bazaar Android app with native voice support, or fill the form manually.');return;
 }
 reply('LB_NATIVE_VOICE_STATUS',{message:'Opening Android voice recognition…'});
 responseTimer=setTimeout(function(){window.onAndroidVoiceError('No response from Android voice. Check microphone permission and try again.');try{if(typeof window.AndroidVoice.stopRecognition==='function')window.AndroidVoice.stopRecognition();}catch(_){}},60000);
 try{window.AndroidVoice.startRecognition(activeMode);}catch(error){window.onAndroidVoiceError(error.message);}
});
</script>
</body>
</html>
